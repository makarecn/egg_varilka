<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let timerInterval = null;
    let remainingSeconds = 0;
    let isRunning = false;

    // Заставка
    setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
    }, 2500);

    // Клик по яйцу
    document.querySelectorAll('.stage').forEach(stage => {
        stage.addEventListener('click', () => {
            const seconds = parseInt(stage.dataset.time);
            startNewTimer(seconds);
        });
    });

    function startNewTimer(seconds) {
        stopTimer(); // останавливаем старый, если был

        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('timer-screen').style.display = 'flex';

        remainingSeconds = seconds;
        isRunning = false;

        updateDisplay();

        const startBtn = document.getElementById('start-btn');
        const egg = document.getElementById('dancing-egg');

        egg.style.display = 'none';
        startBtn.innerText = 'Старт';
        startBtn.disabled = false;

        startBtn.onclick = toggleTimer;
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            runTimer();
        }
    }

    function runTimer() {
        if (isRunning) return;

        isRunning = true;
        document.getElementById('start-btn').innerText = 'Пауза';
        document.getElementById('dancing-egg').style.display = 'block';

        timerInterval = setInterval(() => {
            remainingSeconds--;
            updateDisplay();

            if (remainingSeconds <= 0) {
                finishTimer();
            }
        }, 1000);
    }

    function pauseTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        document.getElementById('start-btn').innerText = 'Продолжить';
        document.getElementById('dancing-egg').style.display = 'none';
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        isRunning = false;
    }

    function finishTimer() {
        stopTimer();
        document.getElementById('dancing-egg').style.display = 'none';
        
        Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        Telegram.WebApp.showAlert('🥚 Яйцо готово!\nПриятного аппетита!');
        
        document.getElementById('start-btn').innerText = 'Старт';
    }

    function updateDisplay() {
        const min = Math.floor(remainingSeconds / 60);
        const sec = remainingSeconds % 60;
        document.getElementById('timer-display').innerText = 
            `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function showFacts() {
        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('facts-screen').style.display = 'block';
    }

    function backToMain() {
        stopTimer();
        document.getElementById('timer-screen').style.display = 'none';
        document.getElementById('facts-screen').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
    }

    // Очистка при выходе
    window.addEventListener('beforeunload', stopTimer);
</script>
