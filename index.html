<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let timerInterval = null;
    let endTime = 0;           // точное время, когда таймер должен закончиться
    let isRunning = false;

    // Заставка
    setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
    }, 2500);

    // Клик по яйцу
    document.querySelectorAll('.stage').forEach(stage => {
        stage.addEventListener('click', () => {
            const seconds = parseInt(stage.dataset.time);
            startNewTimer(seconds);
        });
    });

    function startNewTimer(totalSeconds) {
        stopTimer();

        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('timer-screen').style.display = 'flex';

        endTime = Date.now() + totalSeconds * 1000;
        isRunning = false;

        updateDisplay();

        const startBtn = document.getElementById('start-btn');
        const egg = document.getElementById('dancing-egg');

        egg.style.display = 'none';
        startBtn.innerText = 'Старт';
        startBtn.disabled = false;

        startBtn.onclick = toggleTimer;
    }

    function toggleTimer() {
        if (isRunning) {
            pauseTimer();
        } else {
            runTimer();
        }
    }

    function runTimer() {
        if (isRunning) return;

        isRunning = true;
        document.getElementById('start-btn').innerText = 'Пауза';
        document.getElementById('dancing-egg').style.display = 'block';

        // Главный цикл таймера
        timerInterval = setInterval(() => {
            const now = Date.now();
            let remaining = Math.max(0, Math.ceil((endTime - now) / 1000));

            updateDisplay(remaining);

            if (remaining <= 0) {
                finishTimer();
            }
        }, 150);   // чуть чаще, чем секунда — выглядит плавнее
    }

    function pauseTimer() {
        isRunning = false;
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('start-btn').innerText = 'Продолжить';
        document.getElementById('dancing-egg').style.display = 'none';
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        isRunning = false;
    }

    function finishTimer() {
        stopTimer();
        document.getElementById('dancing-egg').style.display = 'none';
        
        Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        Telegram.WebApp.showAlert('🥚 Яйцо готово!\nПриятного аппетита!');
        
        document.getElementById('start-btn').innerText = 'Старт';
    }

    // Обновление цифр
    function updateDisplay(remaining = null) {
        if (remaining === null) {
            const now = Date.now();
            remaining = Math.max(0, Math.ceil((endTime - now) / 1000));
        }
        const min = Math.floor(remaining / 60);
        const sec = remaining % 60;
        document.getElementById('timer-display').innerText = 
            `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function showFacts() {
        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('facts-screen').style.display = 'block';
    }

    function backToMain() {
        stopTimer();
        document.getElementById('timer-screen').style.display = 'none';
        document.getElementById('facts-screen').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
    }

    window.addEventListener('beforeunload', stopTimer);
</script>
