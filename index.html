<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Варилка Яиц 🥚</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #6a1b9a;
            font-family: Arial, sans-serif;
            color: #fff;
            text-align: center;
        }
        .screen {
            display: none;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 12px 28px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            margin: 10px;
            cursor: pointer;
        }
        #main-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 25px;
        }
        .stages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 500px;
        }
        .stage {
            cursor: pointer;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        .stage:hover {
            transform: scale(1.05);
        }
        .stage img {
            width: 100%;
            height: auto;
            display: block;
        }
        #timer-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.3);
        }
        #timer-label {
            font-size: 2rem;
            margin: 10px 0;
        }
        #timer-display {
            font-size: 5rem;
            font-weight: bold;
            margin: 10px 0;
        }
        #dancing-egg {
            max-width: 70vw;
            max-height: 40vh;
            margin: 20px auto;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(255,255,255,0.6);
        }
        #facts-screen {
            padding: 20px;
            overflow-y: auto;
        }
        #facts-screen ul {
            text-align: left;
            max-width: 90%;
            margin: 15px auto;
            padding-left: 20px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        #splash {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background: #6a1b9a;
        }
        #splash img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #splash-text {
            position: relative;
            z-index: 10;
            color: #ffcc00;
            background: linear-gradient(to bottom, #ffcc00, #ffb300);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.6rem;
            font-weight: 900;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-shadow: none;
            text-align: center;
            max-width: 90%;
            line-height: 1.15;
            padding: 0 20px 80px;
            margin-bottom: 15%;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Заставка -->
    <div id="splash" class="screen">
        <img src="splash.gif.gif" alt="Splash">
        <div id="splash-text">Cook This Damn Egg Already</div>
    </div>

    <!-- Главный экран: 6 видов желтка без надписей -->
    <div id="main-screen" class="screen">
        <div class="stages-grid">
            <!-- 1. Очень жидкий ~2 мин -->
            <div class="stage" data-time="120">
                <img src="https://images.unsplash.com/photo-1606857521015-7f9fcf423740?w=800" alt="Очень жидкий">
            </div>

            <!-- 2. Жидкий всмятку ~3 мин -->
            <div class="stage" data-time="180">
                <img src="https://feelgoodfoodie.net/wp-content/uploads/2020/11/how-to-boil-eggs-Soft-Medium-Hard.jpg" alt="Всмятку">
            </div>
            <!-- 3. Полужидкий ~4 мин -->
            <div class="stage" data-time="240">
                <img src="https://www.seriouseats.com/thmb/3k3G8r0j4c2j5y5y5y5y5y5y5y5=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/soft-boiled-eggs-hero-2-2-2-2
