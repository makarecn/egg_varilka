<script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    let currentInterval = null;
    let currentSeconds = 0;
    let isRunning = false;
    let endTime = 0;                    // ← главное изменение

    // Заставка
    setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
    }, 2800);

    // Выбор режима
    document.querySelectorAll('.stage').forEach(stage => {
        stage.addEventListener('click', () => {
            const seconds = parseInt(stage.dataset.time);
            openTimer(seconds);
        });
    });

    function openTimer(initialSeconds) {
        stopCurrentTimer();

        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('timer-screen').style.display = 'flex';

        currentSeconds = initialSeconds;
        isRunning = false;
        endTime = 0;

        updateTimerDisplay();

        const startBtn = document.getElementById('start-btn');
        const egg = document.getElementById('dancing-egg');

        egg.style.display = 'none';
        startBtn.innerText = 'Старт';
        startBtn.disabled = false;

        startBtn.onclick = () => {
            if (!isRunning) {
                startTimer();
            } else {
                pauseTimer();
            }
        };
    }

    function startTimer() {
        if (isRunning) return;

        isRunning = true;
        const startBtn = document.getElementById('start-btn');
        const egg = document.getElementById('dancing-egg');

        startBtn.innerText = 'Пауза';
        egg.style.display = 'block';

        // Устанавливаем точное время окончания
        endTime = Date.now() + currentSeconds * 1000;

        currentInterval = setInterval(() => {
            const remaining = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
            currentSeconds = remaining;

            updateTimerDisplay();

            if (currentSeconds <= 0) {
                finishTimer();
            }
        }, 100);   // обновляем чаще — таймер выглядит плавнее
    }

    function pauseTimer() {
        if (!isRunning) return;

        isRunning = false;
        clearInterval(currentInterval);
        currentInterval = null;

        document.getElementById('start-btn').innerText = 'Продолжить';
        document.getElementById('dancing-egg').style.display = 'none';
    }

    function stopCurrentTimer() {
        if (currentInterval) {
            clearInterval(currentInterval);
            currentInterval = null;
        }
    }

    function finishTimer() {
        stopCurrentTimer();
        isRunning = false;

        document.getElementById('dancing-egg').style.display = 'none';

        Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        Telegram.WebApp.showAlert('🥚 Яйцо готово!\nПриятного аппетита!');

        document.getElementById('start-btn').innerText = 'Старт';
    }

    function updateTimerDisplay() {
        const min = Math.floor(currentSeconds / 60);
        const sec = currentSeconds % 60;
        document.getElementById('timer-display').innerText = 
            `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function showFacts() {
        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('facts-screen').style.display = 'block';
    }

    function backToMain() {
        stopCurrentTimer();
        document.getElementById('timer-screen').style.display = 'none';
        document.getElementById('facts-screen').style.display = 'none';
        document.getElementById('main-screen').style.display = 'flex';
    }

    window.addEventListener('beforeunload', stopCurrentTimer);
</script>
